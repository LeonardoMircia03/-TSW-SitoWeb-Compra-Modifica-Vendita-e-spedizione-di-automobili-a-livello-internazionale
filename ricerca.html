<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compra e Vendi Auto</title>
  <link rel="stylesheet" href="stilicss/ricerca.css" />
</head>

<body>

  <header>
    <h1>AutoMarket</h1>
    <p>Compra e vendi auto in pochi click</p>
  </header>

  <main>
    <!-- Sezione Ricerca Auto -->
    <section class="search-section">
      <h2>Cerca Automobili</h2>
      <form class="search-form">
        <div class="form-group">
          <label for="marca">Marca</label>
          <select id="marca">
            <option value="">Seleziona...</option>

          </select>
        </div>

        <div class="form-group">
          <label for="modello">Modello</label>
          <select id="modello">
            <option value="">Seleziona...</option>

          </select>
        </div>

        <div class="form-group">
          <label for="prezzo-max">Prezzo massimo</label>
          <input type="number" id="prezzo-max" placeholder="€" />
        </div>

        <div class="form-group">
          <label for="citta">Città</label>
          <input type="text" id="citta" placeholder="Inserisci città" />
        </div>

        <button type="submit" class="btn">Cerca Auto</button>
      </form>
    </section>

    <!-- Sezione Inserisci Annuncio -->
    <section class="post-section">
      <h2>Vendi la tua Auto</h2>
      <form class="post-form">
        <div class="form-group">
          <label for="titolo">Titolo annuncio</label>
          <input type="text" id="titolo" placeholder="Es. Fiat 500X in ottime condizioni" />
        </div>

        <div class="form-group">
          <label for="descrizione">Descrizione</label>
          <textarea id="descrizione" rows="4" placeholder="Descrivi la tua auto..."></textarea>
        </div>

        <div class="form-group">
          <label for="prezzo">Prezzo</label>
          <input type="number" id="prezzo" placeholder="€" />
        </div>

        <div class="form-group">
          <label for="foto">Foto dell'auto</label>
          <input type="file" id="foto" accept="image/*" />
        </div>

        <button type="submit" class="btn">Pubblica Annuncio</button>
      </form>
    </section>
  </main>
  <section class="results-section">
    <h2>Risultati della ricerca</h2>
    <p class="subtitle">Ecco le auto che corrispondono ai tuoi criteri.</p>
    <!-- Risultati qui -->
  </section>
</section>
<form class="post-form" action="inserisci.php" method="post" enctype="multipart/form-data"></form>
  <footer>
    <p>&copy; 2025 AutoFacile.it - Tutti i diritti riservati.</p>
  </footer>

</body>
<script>
  document.querySelector('.search-form').addEventListener('submit', function(e) {
      e.preventDefault();
  
      const formData = new FormData(this);
      let queryString = new URLSearchParams(formData).toString();
  
      fetch('ricerca.php?' + queryString)
          .then(response => response.text())
          .then(html => {
              document.querySelector('.results-section').innerHTML = html;
          });
  });
  </script>
</html>
